[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gastric-multitask-lasso"
version = "0.1.0"
description = "Pathway-regularized Cox models for selective sharing across gastrointestinal cancers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.19.2,<3",
  "scipy>=1.6.0,<2",
  "pandas>=1.2.1,<3",
  "scikit-learn>=0.24.2,<2",
  "matplotlib>=3.3.4,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
