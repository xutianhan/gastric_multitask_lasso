# Reference environment observed in the local numerical verification.
# Availability of historical builds depends on platform and Conda channels.
name: gastric-mtl-reference
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.7
  - numpy=1.19.2
  - scipy=1.6.0
  - pandas=1.2.1
  - scikit-learn=0.24.2
  - matplotlib=3.3.4
  - pip
  - setuptools>=61
  - wheel
